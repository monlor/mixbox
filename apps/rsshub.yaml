metadata:
  id: rsshub
  name: rsshub
  displayName: RSSHub
  description: 🍰 Everything is RSSible - RSS 聚合器，支持各种奇怪的格式
  category: network-tools
  version: latest
  stars: 28500
  icon: https://docs.rsshub.app/img/logo.png
  author: DIYgod
  website: https://docs.rsshub.app/

spec:
  image: diygod/rsshub:latest
  port: 1200
  env:
    NODE_ENV: production
    CACHE_TYPE: redis
    REDIS_URL: redis://redis:6379/
  volumes:
    - rsshub_data:/app/data
  depends_on:
    - redis
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:1200/"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
    depends_on:
      - redis
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rsshub.rule=Host(`rsshub.{DEFAULT_DOMAIN}`)"
      - "traefik.http.services.rsshub.loadbalancer.server.port=1200"

  redis:
    image: redis:alpine
    container_name: rsshub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  rsshub_data:
  redis_data: