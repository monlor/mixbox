metadata:
  id: rsshub
  name: rsshub
  displayName: RSSHub
  description: 🍰 Everything is RSSible - RSS 聚合器，支持各种奇怪的格式
  category: network-tools
  version: "2024.01.15"
  stars: 28500
  icon: https://docs.rsshub.app/img/logo.png
  author: DIYgod
  website: https://docs.rsshub.app/
  mainPort: 1200

services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mixbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    container_name: rsshub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mixbox

networks:
  mixbox:
    external: true

volumes:
  redis_data: