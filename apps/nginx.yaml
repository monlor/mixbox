metadata:
  id: nginx
  name: nginx
  displayName: Nginx
  description: 🌐 高性能Web服务器和反向代理
  category: network-tools
  version: "1.25.3"
  stars: 15200
  icon: https://nginx.org/nginx.png
  author: Nginx Inc
  website: https://nginx.org/
  mainPort: 80

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    environment:
      NGINX_HOST: "{DEFAULT_DOMAIN}"
      NGINX_PORT: "80"
    volumes:
      - nginx_conf:/etc/nginx/conf.d
      - nginx_html:/usr/share/nginx/html
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - mixbox
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mixbox:
    external: true

volumes:
  nginx_conf:
  nginx_html:
  nginx_logs: