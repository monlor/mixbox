metadata:
  name: "MixBox Application Catalog"
  version: "1.0.0"
  description: "Official application catalog for MixBox Docker service management platform"
  lastUpdate: "2024-08-21"

categories:
  - id: "monitoring"
    name: "监控工具"
    description: "系统监控和数据可视化工具"
  - id: "database"
    name: "数据库"
    description: "数据存储和缓存服务"
  - id: "network-tools"
    name: "网络工具"
    description: "反向代理、负载均衡和网络服务"
  - id: "management"
    name: "管理工具"
    description: "容器和系统管理界面"
  - id: "content"
    name: "内容服务"
    description: "内容聚合和分发服务"

applications:
  - id: "grafana"
    name: "grafana"
    displayName: "Grafana"
    description: "开源监控和可视化平台，支持多种数据源"
    category: "monitoring"
    version: "10.2.3"
    stars: 58000
    mainPort: 3000
    icon: "https://grafana.com/static/img/grafana_icon.svg"
    author: "Grafana Labs"
    website: "https://grafana.com"
    tags: ["monitoring", "visualization", "dashboard"]
    configFile: "grafana.yaml"

  - id: "nginx"
    name: "nginx"
    displayName: "Nginx"
    description: "高性能Web服务器和反向代理服务器"
    category: "network-tools"
    version: "1.25.3"
    stars: 19000
    mainPort: 80
    icon: "https://nginx.org/nginx.png"
    author: "Nginx Inc"
    website: "https://nginx.org"
    tags: ["proxy", "web-server", "load-balancer"]
    configFile: "nginx.yaml"

  - id: "portainer"
    name: "portainer"
    displayName: "Portainer"
    description: "Docker容器管理界面，简化容器部署和管理"
    category: "management"
    version: "2.19.4"
    stars: 28000
    mainPort: 9000
    icon: "https://portainer.io/images/logo_portainer.png"
    author: "Portainer"
    website: "https://portainer.io"
    tags: ["docker", "management", "gui"]
    configFile: "portainer.yaml"

  - id: "prometheus"
    name: "prometheus"
    displayName: "Prometheus"
    description: "开源系统监控和报警工具包"
    category: "monitoring"
    version: "2.48.1"
    stars: 51000
    mainPort: 9090
    icon: "https://prometheus.io/assets/prometheus_logo-cb55bb5c346.png"
    author: "Prometheus Authors"
    website: "https://prometheus.io"
    tags: ["monitoring", "metrics", "alerting"]
    configFile: "prometheus.yaml"

  - id: "redis"
    name: "redis"
    displayName: "Redis"
    description: "内存数据结构存储，用作数据库、缓存和消息代理"
    category: "database"
    version: "7.2.4"
    stars: 63000
    mainPort: 6379
    icon: "https://redis.io/images/redis-white.png"
    author: "Redis Ltd"
    website: "https://redis.io"
    tags: ["database", "cache", "in-memory"]
    configFile: "redis.yaml"

  - id: "rsshub"
    name: "rsshub"
    displayName: "RSSHub"
    description: "万物皆可RSS，为任何内容生成RSS订阅源"
    category: "content"
    version: "2024.01.15"
    stars: 28000
    mainPort: 1200
    icon: "https://docs.rsshub.app/logo.png"
    author: "DIYgod"
    website: "https://docs.rsshub.app"
    tags: ["rss", "content", "aggregation"]
    configFile: "rsshub.yaml"