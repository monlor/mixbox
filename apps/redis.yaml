metadata:
  id: redis
  name: redis
  displayName: Redis
  description: ⚡ 内存数据库，高性能键值存储
  category: database
  version: "7.2.4"
  stars: 62400
  icon: https://redis.io/images/redis-white.png
  author: Redis Ltd
  website: https://redis.io/
  mainPort: 6379

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    environment:
      REDIS_PASSWORD: redis123
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mixbox
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mixbox:
    external: true

volumes:
  redis_data: