metadata:
  id: redis
  name: redis
  displayName: Redis
  description: ⚡ 内存数据库，高性能键值存储
  category: database
  version: alpine
  stars: 62400
  icon: https://redis.io/images/redis-white.png
  author: Redis Ltd
  website: https://redis.io/

spec:
  image: redis:alpine
  port: 6379
  env:
    REDIS_PASSWORD: redis123
  volumes:
    - redis_data:/data
  command: redis-server --appendonly yes --requirepass redis123
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

volumes:
  redis_data: