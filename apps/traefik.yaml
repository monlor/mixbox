metadata:
  id: traefik
  name: traefik
  displayName: Traefik
  description: 🌐 现代化反向代理和负载均衡器 - MixBox内置7层代理
  category: network-tools
  version: "3.0"
  stars: 45200
  icon: https://traefik.io/static/traefik-proxy-logo--white-82153be41e0ce620a921b4bce974f6d8.svg
  author: Traefik Labs
  website: https://traefik.io/
  mainPort: 80

services:
  traefik:
    image: traefik:v3.0
    container_name: mixbox-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=mixbox"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mixbox.acme.httpchallenge=true"
      - "--certificatesresolvers.mixbox.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.mixbox.acme.email=admin@{DEFAULT_DOMAIN}"
      - "--certificatesresolvers.mixbox.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.{DEFAULT_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    networks:
      - mixbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mixbox:
    external: true

volumes:
  traefik_letsencrypt: